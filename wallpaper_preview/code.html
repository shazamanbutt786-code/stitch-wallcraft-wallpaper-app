</button>

</button>

<script>
  const favBtn = document.getElementById('fav-btn');
  const favIcon = document.getElementById('fav-icon');
  let isFav = false;
  favBtn.addEventListener('click', () => {
    isFav = !isFav;
    favIcon.style.fontVariationSettings = isFav ? "'FILL' 1" : "'FILL' 0";
    favBtn.classList.toggle('text-error', isFav);
    favBtn.classList.toggle('text-on-surface', !isFav);
  });

  const infoBtn = document.getElementById('info-btn');
  const infoToast = document.getElementById('info-toast');
  infoBtn.addEventListener('click', () => {
    infoToast.classList.toggle('hidden');
  });

  const downloadBtn = document.getElementById('download-btn');
  const downloadIcon = document.getElementById('download-icon');
  downloadBtn.addEventListener('click', () => {
    downloadIcon.textContent = 'check';
    downloadBtn.classList.remove('bg-surface-container-low', 'text-on-surface');
    downloadBtn.classList.add('bg-tertiary-fixed', 'text-on-tertiary-fixed');
    setTimeout(() => {
      downloadIcon.textContent = 'download';
      downloadBtn.classList.add('bg-surface-container-low', 'text-on-surface');
      downloadBtn.classList.remove('bg-tertiary-fixed', 'text-on-tertiary-fixed');
    }, 1800);
  });

  const saveBtn = document.getElementById('save-btn');
  const saveIcon = document.getElementById('save-icon');
  let isSaved = false;
  saveBtn.addEventListener('click', () => {
    isSaved = !isSaved;
    saveIcon.textContent = isSaved ? 'bookmark_added' : 'bookmark_add';
    saveIcon.style.fontVariationSettings = isSaved ? "'FILL' 1" : "'FILL' 0";
  });

  const applyBtn = document.getElementById('apply-btn');
  const applyIcon = document.getElementById('apply-icon');
  const applyText = document.getElementById('apply-text');
  applyBtn.addEventListener('click', () => {
    applyIcon.textContent = 'check_circle';
    applyText.textContent = 'Wallpaper Applied!';
    applyBtn.classList.remove('bg-primary-container');
    applyBtn.classList.add('bg-tertiary-container');
    setTimeout(() => {
      applyIcon.textContent = 'wallpaper';
      applyText.textContent = 'Set Wallpaper';
      applyBtn.classList.add('bg-primary-container');
      applyBtn.classList.remove('bg-tertiary-container');
    }, 2200);
  });
</script></main></body></html>
