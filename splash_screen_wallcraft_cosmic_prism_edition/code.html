<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Splash Screen - WallCraft (Cosmic Prism Edition)</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            display: ['"Space Grotesk"', 'sans-serif'],
          },
          colors: {
            primary: {
              DEFAULT: '#8b6cf7',
              400: '#a78bfa',
              500: '#8b6cf7',
              600: '#7c3aed',
            },
            accent: {
              cyan: '#38bdf8',
              teal: '#2dd4bf',
              pink: '#f43f5e',
              purple: '#c084fc',
            },
            oled: '#06070a',
            surface: {
              dark: '#0e111a',
              card: 'rgba(18, 22, 34, 0.72)',
            }
          },
          animation: {
            'spin-slow': 'spin 22s linear infinite',
            'spin-reverse': 'spinRev 18s linear infinite',
            'float-slow': 'float 5s ease-in-out infinite',
            'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
            'shimmer-beam': 'shimmer 2.4s ease-in-out infinite',
            'ping-slow': 'pingSlow 2.5s cubic-bezier(0, 0, 0.2, 1) infinite',
          },
          keyframes: {
            spinRev: {
              '0%': { transform: 'rotate(360deg)' },
              '100%': { transform: 'rotate(0deg)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px) scale(1)' },
              '50%': { transform: 'translateY(-8px) scale(1.02)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.45', transform: 'scale(0.96)' },
              '50%': { opacity: '0.85', transform: 'scale(1.06)' },
            },
            shimmer: {
              '0%': { transform: 'translateX(-100%)' },
              '100%': { transform: 'translateX(200%)' },
            },
            pingSlow: {
              '75%, 100%': { transform: 'scale(1.8)', opacity: '0' },
            }
          }
        }
      }
    };
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #06070a;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .mesh-radial-bg {
      background: radial-gradient(circle at 50% 32%, rgba(124, 58, 237, 0.28) 0%, rgba(56, 189, 248, 0.15) 35%, rgba(6, 7, 10, 0.95) 70%, #06070a 100%);
    }
    .glass-card {
      background: rgba(18, 22, 34, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }
    .glass-pill {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .neon-text-glow {
      text-shadow: 0 0 24px rgba(139, 108, 247, 0.6), 0 0 45px rgba(56, 189, 248, 0.35);
    }
    .neon-border-glow {
      box-shadow: 0 0 25px rgba(124, 58, 237, 0.45), inset 0 0 15px rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body class="w-full h-screen overflow-hidden flex flex-col justify-between relative bg-oled text-white selection:bg-primary-500">

  <!-- Ambient Animated Starfield & Grid Mesh Background -->
  <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
    <!-- Fine OLED Cyber Grid -->
    <div class="absolute inset-0 opacity-[0.07]" style="background-image: linear-gradient(to right, rgba(255,255,255,0.2) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.2) 1px, transparent 1px); background-size: 32px 32px;"></div>
    
    <!-- Central Mesh Glow -->
    <div class="absolute inset-0 mesh-radial-bg"></div>

    <!-- Radiant Color Bloom Orbs -->
    <div class="absolute top-[20%] left-1/2 -translate-x-1/2 w-[340px] h-[340px] bg-primary-600/30 rounded-full blur-[90px] animate-pulse-glow"></div>
    <div class="absolute top-[35%] left-[20%] w-[220px] h-[220px] bg-accent-cyan/20 rounded-full blur-[75px] animate-float-slow"></div>
    <div class="absolute bottom-[20%] right-[10%] w-[260px] h-[260px] bg-accent-purple/20 rounded-full blur-[85px]"></div>
  </div>

  <!-- iOS Native Status Bar Overlay -->
  <header class="relative z-20 w-full px-7 pt-3.5 pb-2 flex items-center justify-between text-xs tracking-tight">
    <!-- Time -->
    <span class="font-semibold text-sm tracking-normal text-slate-200">9:41</span>

    <!-- Dynamic Island / Top Pill Status -->
    <div class="glass-pill px-3 py-1 rounded-full flex items-center gap-1.5 border border-white/10 shadow-sm">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
      <span class="text-[10px] uppercase font-mono tracking-wider font-semibold text-emerald-300">OLED ENGINE 4K</span>
    </div>

    <!-- Battery & Signal -->
    <div class="flex items-center gap-1.5 text-slate-300">
      <span class="text-[11px] font-mono tracking-tight font-medium text-slate-300">5G</span>
      <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
      <div class="w-5 h-2.5 rounded-sm border border-slate-300/80 p-0.5 flex items-center">
        <div class="h-full w-3.5 bg-slate-200 rounded-2xs"></div>
      </div>
    </div>
  </header>

  <!-- Main Hero Graphic Area: Floating Prismatic Crystal & Cosmic Vortex -->
  <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 w-full max-w-md mx-auto">
    
    <!-- Central Kinetic Emblem Container -->
    <div class="relative w-72 h-72 flex items-center justify-center my-auto">
      
      <!-- Outer Celestial Compass Dial (Slow Clockwise) -->
      <svg class="absolute inset-0 w-full h-full animate-spin-slow opacity-60" viewBox="0 0 300 300" fill="none">
        <circle cx="150" cy="150" r="135" stroke="rgba(139, 108, 247, 0.25)" stroke-width="1.5" stroke-dasharray="6 10"/>
        <circle cx="150" cy="150" r="122" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" stroke-dasharray="45 30 15 30"/>
        <!-- Cardinal Pointer Diamonds -->
        <polygon points="150,10 153,16 150,22 147,16" fill="#38BDF8"/>
        <polygon points="150,290 153,284 150,278 147,284" fill="#8B6CF7"/>
        <polygon points="10,150 16,147 22,150 16,153" fill="#38BDF8"/>
        <polygon points="290,150 284,147 278,150 284,153" fill="#8B6CF7"/>
      </svg>

      <!-- Counter-Rotating Inner Ring (Fast Counter-Clockwise) -->
      <svg class="absolute inset-4 w-[268px] h-[268px] animate-spin-reverse opacity-80" viewBox="0 0 268 268" fill="none">
        <circle cx="134" cy="134" r="105" stroke="url(#cosmicGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="140 80"/>
        <!-- Orbiting Spark Glints -->
        <circle cx="134" cy="29" r="4.5" fill="#FFFFFF" filter="drop-shadow(0 0 6px #38BDF8)"/>
        <circle cx="239" cy="134" r="3.5" fill="#67E8F9" filter="drop-shadow(0 0 5px #8B6CF7)"/>
        <defs>
          <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="50%" stop-color="#8B6CF7"/>
            <stop offset="100%" stop-color="#EC4899"/>
          </linearGradient>
        </defs>
      </svg>

      <!-- Floating Prismatic Crystal Gemstone Core -->
      <div class="relative z-10 w-36 h-36 flex items-center justify-center animate-float-slow">
        <!-- Back Crystal Glow Aura -->
        <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-primary-500/40 via-accent-cyan/35 to-accent-pink/20 blur-xl"></div>
        
        <!-- Faceted 3D Geometric Crystal SVG -->
        <svg class="w-32 h-32 drop-shadow-[0_12px_28px_rgba(139,108,247,0.7)]" viewBox="0 0 120 120" fill="none">
          <defs>
            <linearGradient id="facetA" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="40%" stop-color="#C084FC"/>
              <stop offset="100%" stop-color="#7C3AED"/>
            </linearGradient>
            <linearGradient id="facetB" x1="100%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#67E8F9"/>
              <stop offset="60%" stop-color="#38BDF8"/>
              <stop offset="100%" stop-color="#2563EB"/>
            </linearGradient>
            <linearGradient id="facetC" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#4C1D95"/>
              <stop offset="60%" stop-color="#8B5CF6"/>
              <stop offset="100%" stop-color="#F43F5E"/>
            </linearGradient>
            <linearGradient id="facetCore" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="50%" stop-color="#DDD6FE"/>
              <stop offset="100%" stop-color="#8B5CF6"/>
            </linearGradient>
          </defs>

          <!-- Outer Hexagonal Shroud -->
          <polygon points="60,6 102,32 102,88 60,114 18,88 18,32" fill="#0C0E17" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linejoin="round"/>
          
          <!-- Facets Left/Right/Top -->
          <polygon points="60,6 102,32 60,52" fill="url(#facetA)" fill-opacity="0.9"/>
          <polygon points="60,6 18,32 60,52" fill="url(#facetB)" fill-opacity="0.95"/>
          <polygon points="18,32 18,88 60,68" fill="url(#facetB)" fill-opacity="0.85"/>
          <polygon points="102,32 102,88 60,68" fill="url(#facetC)" fill-opacity="0.85"/>
          <polygon points="18,88 60,114 60,68" fill="url(#facetA)" fill-opacity="0.9"/>
          <polygon points="102,88 60,114 60,68" fill="url(#facetC)" fill-opacity="0.95"/>
          
          <!-- Central Diamond Heart -->
          <polygon points="60,32 80,52 60,82 40,52" fill="url(#facetCore)" fill-opacity="0.95" stroke="#FFFFFF" stroke-width="1"/>
          
          <!-- Starburst Highlight Glint -->
          <polygon points="60,24 62,32 70,34 62,36 60,44 58,36 50,34 58,32" fill="#FFFFFF"/>
          <circle cx="60" cy="34" r="1.5" fill="#38BDF8"/>
        </svg>
      </div>

      <!-- Orbital Live Micro-Badges around Crystal -->
      <div class="absolute -top-1 left-4 glass-pill px-2.5 py-1 rounded-full text-[10px] font-mono flex items-center gap-1.5 shadow-lg border border-primary-500/30">
        <span class="w-1.5 h-1.5 rounded-full bg-accent-cyan shadow-[0_0_6px_#38bdf8]"></span>
        <span class="text-slate-200">NEURAL 8K</span>
      </div>

      <div class="absolute -bottom-1 right-3 glass-pill px-2.5 py-1 rounded-full text-[10px] font-mono flex items-center gap-1.5 shadow-lg border border-accent-pink/30">
        <span class="w-1.5 h-1.5 rounded-full bg-accent-pink shadow-[0_0_6px_#f43f5e]"></span>
        <span class="text-slate-200">HDR PRO</span>
      </div>

      <div class="absolute top-1/2 -right-5 -translate-y-1/2 glass-pill px-2 py-1 rounded-lg text-[9px] font-mono tracking-wider text-slate-300 border border-white/10 hidden sm:flex">
        <span>120 FPS</span>
      </div>
    </div>

    <!-- Brand Typography & Subtitle -->
    <div class="text-center mt-6 w-full">
      <!-- Main Brand Wordmark with Crystal Dot -->
      <div class="inline-flex items-baseline justify-center">
        <h1 class="text-4xl font-extrabold tracking-tight font-display text-white neon-text-glow">
          Wall<span class="bg-gradient-to-r from-primary-400 via-accent-cyan to-accent-teal bg-clip-text text-transparent">Craft</span>
        </h1>
        <span class="inline-block w-2.5 h-2.5 ml-1 rounded-full bg-accent-cyan shadow-[0_0_12px_#38bdf8] animate-pulse"></span>
      </div>

      <!-- Elevated Tagline with Diamond Dividers -->
      <p class="text-xs font-mono uppercase tracking-[0.28em] text-slate-400 mt-2 flex items-center justify-center gap-2">
        <span>Neural Art</span>
        <span class="text-primary-400 text-[10px]">◆</span>
        <span>Ultra 4K</span>
        <span class="text-accent-cyan text-[10px]">◆</span>
        <span>OLED Black</span>
      </p>

      <!-- Value Props Feature Capsules -->
      <div class="flex flex-wrap items-center justify-center gap-2 mt-4">
        <div class="glass-pill px-3 py-1 rounded-full text-[11px] font-medium text-slate-300 flex items-center gap-1.5 hover:border-white/30 transition-colors">
          <svg class="w-3.5 h-3.5 text-accent-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          <span>Zero Artifacts</span>
        </div>
        <div class="glass-pill px-3 py-1 rounded-full text-[11px] font-medium text-slate-300 flex items-center gap-1.5 hover:border-white/30 transition-colors">
          <svg class="w-3.5 h-3.5 text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <span>Dynamic Depth</span>
        </div>
        <div class="glass-pill px-3 py-1 rounded-full text-[11px] font-medium text-slate-300 flex items-center gap-1.5 hover:border-white/30 transition-colors">
          <svg class="w-3.5 h-3.5 text-accent-teal" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
          <span>Curated Studio</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Interactive Onboarding, Startup Loader & Actions -->
  <footer class="relative z-20 w-full px-6 pb-8 pt-3 max-w-md mx-auto flex flex-col gap-4">
    
    <!-- System Telemetry & Loading Progress Box -->
    <div class="glass-card rounded-2xl p-4 border border-white/10 shadow-2xl relative overflow-hidden">
      <!-- Glow Shimmer highlight sweep -->
      <div class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/5 to-transparent animate-shimmer-beam pointer-events-none"></div>

      <!-- Telemetry Header Row -->
      <div class="flex items-center justify-between text-xs mb-2.5">
        <div class="flex items-center gap-2">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-accent-cyan opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-accent-cyan"></span>
          </span>
          <span class="font-mono text-slate-300 text-[11px] tracking-wide" id="loaderStatusText">Calibrating neural canvas...</span>
        </div>
        <span class="font-mono font-bold text-accent-cyan text-xs tracking-wider" id="percentCounter">92%</span>
      </div>

      <!-- Futuristic Multi-Stop Segmented Gradient Bar -->
      <div class="relative w-full h-2 rounded-full bg-slate-900/80 p-[1px] border border-white/10 overflow-hidden shadow-inner">
        <div class="h-full rounded-full bg-gradient-to-r from-primary-500 via-accent-cyan to-accent-teal shadow-[0_0_12px_#38bdf8] transition-all duration-700 ease-out" style="width: 92%;"></div>
      </div>

      <!-- Hardware & Shader Telemetry Info -->
      <div class="flex items-center justify-between mt-2.5 pt-2 border-t border-white/5 text-[10px] font-mono text-slate-400">
        <span>ENGINE: SDXL-OLED v3.4</span>
        <span class="text-emerald-400 flex items-center gap-1">
          <span class="w-1 h-1 rounded-full bg-emerald-400"></span>
          SHADERS COMPILED
        </span>
      </div>
    </div>

    <!-- Primary Launch Action Button -->
    <button class="relative group w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-primary-600 via-primary-500 to-accent-cyan text-white font-semibold text-sm tracking-wide shadow-[0_10px_30px_-5px_rgba(139,108,247,0.55)] hover:shadow-[0_12px_36px_-4px_rgba(56,189,248,0.65)] active:scale-[0.98] transition-all flex items-center justify-center gap-2 border border-white/20 overflow-hidden">
      <!-- Glow Sweep on Hover -->
      <div class="absolute inset-0 -translate-x-full group-hover:translate-x-full transition-transform duration-1000 bg-gradient-to-r from-transparent via-white/25 to-transparent"></div>
      
      <span class="relative z-10 flex items-center gap-2 font-display text-[15px]">
        Explore Wallpaper Gallery
        <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </span>
    </button>

    <!-- Version & Legal Subtle Signature -->
    <div class="flex items-center justify-between text-[10px] font-mono text-slate-500 px-2 pt-0.5">
      <span>WALLCRAFT LABS © 2025</span>
      <span class="hover:text-slate-300 transition-colors">STUDIO EDITION BUILD 2490</span>
    </div>

    <!-- iOS Home Indicator -->
    <div class="w-32 h-1 bg-white/25 rounded-full mx-auto mt-1"></div>
  </footer>

  <script>
    // Smooth micro-increment on loading bar for organic feel
    const percentEl = document.getElementById('percentCounter');
    const statusTextEl = document.getElementById('loaderStatusText');
    const statusSteps = [
      'Calibrating neural canvas...',
      'Unpacking 8K HDR shaders...',
      'Synchronizing 120Hz buffer...',
      'Ready to explore.'
    ];
    let currentStep = 0;

    setInterval(() => {
      currentStep = (currentStep + 1) % statusSteps.length;
      if (statusTextEl) {
        statusTextEl.textContent = statusSteps[currentStep];
      }
    }, 2800);
  </script>
</body>
</html>
